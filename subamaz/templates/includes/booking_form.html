<form id="booking-form" class="card p-4 mt-3" style="border-radius:1.25rem;border:1px solid #e8e8e8" novalidate>
	<div class="row g-3">
		<div class="col-md-6"><label class="form-label">Customer Name *</label><input class="form-control" name="customer_name" required><div class="invalid-feedback"></div></div>
		<div class="col-md-6"><label class="form-label">Phone *</label><input class="form-control" name="phone" placeholder="+256..." required><div class="invalid-feedback"></div></div>
		<div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" placeholder="jane@example.com"><div class="invalid-feedback"></div></div>
		<div class="col-md-6"><label class="form-label">Vehicle Registration</label><input class="form-control" name="vehicle_registration" placeholder="UAX 123A"><div class="invalid-feedback"></div></div>
		<div class="col-md-6"><label class="form-label">Preferred Date</label><input class="form-control" type="date" name="preferred_date"></div>
		<div class="col-md-6"><label class="form-label">Preferred Time</label><input class="form-control" name="preferred_time" placeholder="10:00 AM"></div>
		<div class="col-12"><label class="form-label">Message</label><textarea class="form-control" name="message" rows="3" placeholder="Brake noise, AC not cooling..."></textarea></div>
	</div>
	<div id="booking-error" class="alert alert-danger mt-3 d-none"></div>
	<div id="booking-success" class="alert alert-success mt-3 d-none">Appointment request submitted — we’ll call you shortly.</div>
	<button type="submit" class="btn mt-3 rounded-pill" style="background:{{ theme.primary_color or '#1A2E72' }};color:#fff;height:44px;padding:0 1.5rem">Submit Request</button>
</form>

<p class="small text-muted mt-3">Frontend validation mirrors the Zod schema: <code>customer_name+phone required, email must contain @, phone non-empty</code> (server also enforces).</p>

<script>
(function(){
	const form = document.getElementById('booking-form');
	if (!form) return;
	const errBox = document.getElementById('booking-error');
	const okBox = document.getElementById('booking-success');
	function validate(data){
		const errors = {};
		if(!data.customer_name || !data.customer_name.trim()) errors.customer_name = "Customer name is required";
		if(!data.phone || !data.phone.trim()) errors.phone = "Phone is required";
		if(data.email && data.email.trim() && !data.email.includes("@")) errors.email = "Invalid email";
		return errors;
	}
	form.addEventListener('submit', async (e)=>{
		e.preventDefault();
		errBox.classList.add('d-none'); okBox.classList.add('d-none');
		const data = Object.fromEntries(new FormData(form).entries());
		const errors = validate(data);
		form.querySelectorAll('[name]').forEach(el=>{
			const msg = errors[el.name];
			el.classList.toggle('is-invalid', !!msg);
			const fb = el.parentElement.querySelector('.invalid-feedback');
			if(fb) fb.textContent = msg || "";
		});
		if(Object.keys(errors).length) { errBox.textContent = "Please fix highlighted fields."; errBox.classList.remove('d-none'); return; }
		const btn = form.querySelector('button[type=submit]');
		btn.disabled = true; btn.textContent = "Submitting...";
		try{
			const res = await fetch('/api/method/subamaz.api.booking.create_appointment_request', {
				method:'POST',
				headers:{'Content-Type':'application/json','X-Frappe-CSRF-Token': frappe.csrf_token || ''},
				body: JSON.stringify(data)
			});
			const json = await res.json();
			if(json.exc){ throw new Error((json._server_messages && JSON.parse(json._server_messages)[0]) || json.exc || "Failed");}
			const name = (json.message && json.message.name) || json.message || "submitted";
			okBox.textContent = "Appointment "+ name +" submitted — we’ll call you shortly.";
			okBox.classList.remove('d-none');
			form.reset();
		}catch(err){
			errBox.textContent = (err && err.message) || "Submission failed";
			errBox.classList.remove('d-none');
		}finally{ btn.disabled=false; btn.textContent="Submit Request";}
	});
})();
</script>
